name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests et types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  apk:
    name: Construire l'APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Générer le projet Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compiler l'APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Renommer l'APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="anniv-v${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
      - name: Publier une pré-version téléchargeable
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Anniv — build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            APK de test d'Anniv, construit automatiquement depuis `${{ github.ref_name }}` (${{ github.sha }}).

            **Installation sur Android** : ouvre cette page sur ton téléphone, télécharge le fichier `.apk`,
            puis ouvre-le (autorise l'installation depuis ton navigateur si Android le demande).
